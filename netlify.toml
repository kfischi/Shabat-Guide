# Netlify — אתר סטטי (public/) + פונקציות (netlify/functions).
# תוכן המדריך יושב בתוך netlify/functions/private ולכן אינו נגיש ישירות מהדפדפן;
# הוא מוגש רק דרך הפונקציה guide לאחר אימות.

[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # לוודא שתוכן ה-private נארז יחד עם הפונקציה guide
  included_files = ["netlify/functions/private/**"]

# קישורים "יפים" -> פונקציות (משמרים query string אוטומטית)
[[redirects]]
  from = "/guide"
  to = "/.netlify/functions/guide"
  status = 200

[[redirects]]
  from = "/grow-webhook"
  to = "/.netlify/functions/grow-webhook"
  status = 200

[[redirects]]
  from = "/ai"
  to = "/.netlify/functions/ai"
  status = 200

[[redirects]]
  from = "/create-payment"
  to = "/.netlify/functions/create-payment"
  status = 200

[[redirects]]
  from = "/lead"
  to = "/.netlify/functions/lead"
  status = 200

[[redirects]]
  from = "/send-guide"
  to = "/.netlify/functions/send-guide"
  status = 200

# Meta Pixel — נטען מהשרת עם המזהה ממשתני הסביבה (רדום עד שמוגדר META_PIXEL_ID)
[[redirects]]
  from = "/px"
  to = "/.netlify/functions/px"
  status = 200

[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

# לינק ייעודי ונקי למכירת מדריך הפרימיום (97₪) — משמש לפרסום ולשיתוף
[[redirects]]
  from = "/premium"
  to = "/upsell.html"
  status = 200

# לינק פתוח למדריך החינמי — נגיש לכולם בלי טוקן ובלי תשלום (מתנה שיווקית ללכידת לידים).
# פונקציה ייעודית (לא query ב-redirect) כי Netlify לא מעביר query מה-`to` לפונקציה.
[[redirects]]
  from = "/free-guide"
  to = "/.netlify/functions/free-guide"
  status = 200

# ── MULTIBRAWN CHECK ── שאלון התאמת מקום לאירוע + תשובת המקום.
# הכול תחת /check כדי שהאתר הראשי (multibrawn.co.il) יוכל להגיש אותו בכלל proxy אחד.
[[redirects]]
  from = "/check/api/request"
  to = "/.netlify/functions/check-request"
  status = 200

[[redirects]]
  from = "/check/api/inquiry"
  to = "/.netlify/functions/check-inquiry"
  status = 200

[[redirects]]
  from = "/check/api/admin"
  to = "/.netlify/functions/check-admin"
  status = 200

[[headers]]
  for = "/check/v/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"
