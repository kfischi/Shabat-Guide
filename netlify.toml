# Netlify — אתר הפרימיום העצמאי של Multibrawn.
# דף הבית (public/index.html) הוא דף המכירה; התשלום דרך GROW;
# מדריך הפרימיום מוגש רק אחרי תשלום דרך פונקציית guide (מאחורי טוקן).

[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/private/**"]

# קישורים "יפים" -> פונקציות (משמרים query string אוטומטית)
[[redirects]]
  from = "/guide"
  to = "/.netlify/functions/guide"
  status = 200

[[redirects]]
  from = "/grow-webhook"
  to = "/.netlify/functions/grow-webhook"
  status = 200

[[redirects]]
  from = "/ai"
  to = "/.netlify/functions/ai"
  status = 200

[[redirects]]
  from = "/create-payment"
  to = "/.netlify/functions/create-payment"
  status = 200

[[redirects]]
  from = "/send-guide"
  to = "/.netlify/functions/send-guide"
  status = 200

[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200
